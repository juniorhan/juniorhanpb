<script>
  // 첫 화면 깜빡임 없이 테마 적용 (저장값 > 시스템 설정)
  (function(){ var t; try { t = localStorage.getItem('theme'); } catch(e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t); })();
</script>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f0f2f5; --line:#e2e6ec; --line-2:#d3d9e2;
  --text:#0d1524; --text-2:#3f4b5e; --mute:#768397;
  --accent:#0f9d8a; --accent-ink:#0b7a6b; --accent-soft:rgba(15,157,138,.10);
  --pos:#12915c; --neg:#d0433f; --amber:#b7800a;
  --b-kr:#2563eb; --b-us:#d97706;                    /* 성과 차트 벤치마크 — 한국 · 미국 */
  --shadow:0 1px 2px rgba(13,21,36,.04),0 4px 16px rgba(13,21,36,.04);
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Pretendard Variable",Pretendard,"Malgun Gothic",monospace;
}
[data-theme=dark]{
  --bg:#0a0f1c; --surface:#0f1628; --surface-2:#141d33; --line:#1d2740; --line-2:#28344f;
  --text:#e8edf6; --text-2:#b4c0d4; --mute:#7c89a3;
  --accent:#2dd4bf; --accent-ink:#5eead4; --accent-soft:rgba(45,212,191,.11);
  --pos:#34d399; --neg:#f87171; --amber:#fbbf24;
  --b-kr:#60a5fa; --b-us:#f59e0b;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}
button{font:inherit;color:inherit}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.mute{color:var(--mute)} .pos{color:var(--pos)} .neg{color:var(--neg)}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
@media(min-width:768px){.wrap{padding:0 28px}}

/* ---------- top bar */
.bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;height:58px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.02em;white-space:nowrap}
/* 로고 = 사용자 프로필 그림(원본 바탕화면 photo_2026-07-10_15-45-21.jpg → ops/assets, 2026-09-23 교체) */
.mark{width:32px;height:32px;border-radius:50%;flex:none;display:block;object-fit:cover;box-shadow:0 0 0 1px var(--line)}
.bar .sp{flex:1}
.live{display:flex;align-items:center;gap:6px;font:500 11px/1 var(--mono);letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;background:var(--pos);box-shadow:0 0 0 3px color-mix(in srgb,var(--pos) 22%,transparent)}
.dot.warn{background:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 22%,transparent)}
.dot.bad{background:var(--neg);box-shadow:0 0 0 3px color-mix(in srgb,var(--neg) 22%,transparent)}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{border-color:var(--line-2)}
.iconbtn svg{width:17px;height:17px}
@media(max-width:520px){.live{display:none}}

/* ---------- hero */
.hero{display:grid;gap:16px;padding:28px 0 8px}
@media(min-width:900px){.hero{grid-template-columns:repeat(4,minmax(0,1fr));column-gap:14px;align-items:end;padding:44px 0 12px}
  .hero > div:first-child{grid-column:span 2}}
.eyebrow{font:600 11.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink)}
h1{font-size:clamp(34px,6vw,54px);line-height:1.02;letter-spacing:-.035em;margin:12px 0 14px;font-weight:750}
.updated{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;color:var(--text-2);font-size:14px}
.updated .num{color:var(--text);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);font-size:12.5px;color:var(--text-2)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);margin-top:20px}
.seg button{border:0;background:none;padding:8px 18px;border-radius:9px;cursor:pointer;color:var(--mute);font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.seg .cnt{font:500 11px var(--mono);margin-left:6px;color:var(--mute)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
/* 다음 거래일(관심 기간) — 카드 대신 제목 영역의 한 줄(2026-09-23). 한국·미국 같은 형식 '날짜 + 한국시간 범위', 설명은 title */
.pill.nx{flex-wrap:wrap;row-gap:2px}
.pill.nx > span{white-space:nowrap}
.pill.nx .k{font-weight:600;color:var(--accent-ink)}
.pill .amb{color:var(--amber)}
@media(max-width:640px){.pill.nx{border-radius:10px}}
.warnbox{margin:12px 0 0;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--amber) 12%,transparent);
  color:var(--amber);font-size:13px;border:1px solid color-mix(in srgb,var(--amber) 30%,transparent)}

/* ---------- 시장 기준지수 카드(index_cards.py, 2026-09-23) — 참고 표시, Score·순위와 무관.
   원래 NEXT SESSION 카드 자리에 선택한 시장 지수 4개를 2×2로. 900px↑은 제목 영역이 KPI와 같은 4열 격자라
   왼쪽 열 = 'Score 80+ 이탈' 카드 선, 오른쪽 열 = '최다 섹터' 카드 선(간격도 KPI와 같은 14px) */
.idx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;min-width:0}
@media(min-width:900px){.hero > .idx{grid-column:span 2;gap:14px}}
.ix{padding:11px 12px 10px;min-width:0}
.ix .n{font:600 11.5px/1.2 var(--sans);color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ix .v{font:600 16px/1.2 var(--mono);letter-spacing:-.02em;color:var(--text);margin-top:6px;white-space:nowrap}
.ix .f{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;margin-top:4px;min-height:20px}
.ix .c{font:500 12px/1 var(--mono);white-space:nowrap}
.isp{display:block;flex:none}
.isp .l{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.isp .a{fill:currentColor;opacity:.12}
@media(max-width:640px){.idx{gap:8px}.ix{padding:9px 11px}.ix .v{font-size:15px;margin-top:4px}}

/* ---------- sections */
section{margin-top:28px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.sh h2{margin:0;font:700 16px/1.2 var(--sans);letter-spacing:-.02em;color:var(--text);white-space:nowrap}
.sh h2 .en{font:600 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);margin-right:8px;vertical-align:2px}
.ko{font-family:var(--sans);letter-spacing:-.01em}
.sh .note{font-size:12.5px;color:var(--mute)}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:900px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}}
.kpi{padding:16px 18px 18px;min-width:0}

  }

  pts.forEach(function(p){ p.on = p.x > 0 && p.y > 0; });
  var W = 440, H = 320, L = 12, R = 12, T = 12, B = 30;
  var rng = function(a){ var lo = Math.min(0, Math.min.apply(null, a)), hi = Math.max(0, Math.max.apply(null, a)), pad = (hi - lo) * 0.1 || 1; return [lo - pad, hi + pad]; };
  var rx = rng(pts.map(function(p){ return p.x; })), ry = rng(pts.map(function(p){ return p.y; }));
  var X = function(v){ return L + (v - rx[0]) / (rx[1] - rx[0]) * (W - L - R); };
  var Y = function(v){ return T + (1 - (v - ry[0]) / (ry[1] - ry[0])) * (H - T - B); };
  var n1 = function(v){ return v.toFixed(1); }, x0 = X(0), y0 = Y(0);

    + '<line class="mz" x1="' + L + '" x2="' + (W - R) + '" y1="' + n1(y0) + '" y2="' + n1(y0) + '"/>'
    + '<line class="mz" x1="' + n1(x0) + '" x2="' + n1(x0) + '" y1="' + T + '" y2="' + (H - B) + '"/>'

    + '<text class="mq" x="' + (L + 4) + '" y="' + (T + 14) + '">약하지만 가속</text>'
    + '<text class="mq" x="' + (W - R - 4) + '" y="' + (H - B - 7) + '" text-anchor="end">강하지만 둔화</text>'

    + '<text class="mx" x="' + (W - R) + '" y="' + (H - 9) + '" text-anchor="end">중기 강도 (Core RS) →</text>';
  // 라벨 — 사분면 글자·점과 겹치지 않는 자리(오른쪽·왼쪽·위·아래)를 찾고, 없으면 생략(마우스를 올리면 이름이 보인다)
  var boxes = [[W - R - 76, T, W - R, T + 18], [L, T, L + 84, T + 18], [W - R - 76, H - B - 21, W - R, H - B - 3], [L, H - B - 21, L + 76, H - B - 3]];
  pts.forEach(function(p){ p.cx = X(p.x); p.cy = Y(p.y); boxes.push([p.cx - 5, p.cy - 5, p.cx + 5, p.cy + 5]); });
  var tw = function(t){ var w = 0; for (var i = 0; i < t.length; i++) w += t.charCodeAt(i) > 0x2e80 ? 10.5 : 6.1; return w; };
  var place = function(p){
    var t = String(p.lb); t = t.length > 20 ? t.slice(0, 19) + '…' : t;
    var w = tw(t), cx = p.cx, cy = p.cy, right = cx > W - 140, c = [];
    [right ? -1 : 1, right ? 1 : -1].forEach(function(d){ c.push([d, cy + 3.5]); });
    c.push([0, cy - 9], [0, cy + 16]);
    for (var i = 0; i < c.length; i++) {
      var d = c[i][0], y = c[i][1], x = d > 0 ? cx + 8 : d < 0 ? cx - 8 : Math.max(w / 2 + 2, Math.min(W - w / 2 - 2, cx));   // 위·아래는 가장자리에서 안쪽으로
      var x1 = d > 0 ? x : d < 0 ? x - w : x - w / 2, bx = [x1, y - 9, x1 + w, y + 2];

      return '<text class="ml' + (p.on ? ' on' : '') + '" x="' + n1(x) + '" y="' + n1(y) + '"' + (d < 0 ? ' text-anchor="end"' : d === 0 ? ' text-anchor="middle"' : '') + '>' + esc(t) + '</text>';

  var dots = pts.slice().sort(function(a, b){ return a.on - b.on; }).map(function(p){      // 색 점을 위에

    .map(function(p){ var t = place(p); return t ? '<g class="mpt"' + att(p) + '><title>' + esc(p.tip) + '</title>' + t + '</g>' : ''; }).join('');
  return s + dots + labs + '</svg>';
}

    $('#app').innerHTML = '<div class="hero"><div><div class="eyebrow">RS Tracker</div><h1>' + esc(mkName(ESTUB[k].name)) + '</h1></div></div><section><div class="card empty" id="eload">불러오는 중…</div></section>';
    fetch('data/' + k + '/main.json', {cache: 'no-cache'}).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(j){ MK[k] = j; (D.suspended = D.suspended || {})[k] = j.susp || []; (D.suspended_note = D.suspended_note || {})[k] = j.susp_note || [];
        if (S.view === 'etf') go(k, t); })
      .catch(function(){ var e = $('#eload'); if (e) e.textContent = 'ETF 자료를 불러오지 못했습니다.'; });
    return;
  }
  if (S.mk !== k) { S.mk = k; S.q = ''; S.sel = false; S.liq = null; S.vr = null; S.labels = {}; S.ind = null; S.gi = null; S.iall = false; S.sk = 'pos'; S.sd = 1; S.date = null; S.pall = false; S.rep = false; S.top = false; }
  S.view = isEtfKey(k) ? 'etf' : 'stock'; LASTMK[S.view] = k;
  cur = prep(MK[k]);
  closeDrawer(false);
  render();
  if (t && cur.by[t]) openDrawer(t, true); else setHash(null);   // true = 주소에 종목 표시(이미 같으면 그대로) — MP 추천 종목에서 ETF로 넘어갈 때 주소가 #mp로 남던 것(2026-10-03)
}
mpTabSync();
document.querySelectorAll('#tabs button').forEach(function(b){ b.onclick = function(){
  var v = b.dataset.view; if (v === S.view && v !== 'mp') return;
  navDo(function(){ go(v === 'mp' ? 'mp' : LASTMK[v]); }); window.scrollTo(0, 0); }; });

function themeIcon(){ var d = document.documentElement.getAttribute('data-theme') === 'dark'; $('#theme').innerHTML = d ? ICON_SUN : ICON_MOON; }
$('#theme').onclick = function(){
  var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('theme', t); } catch (e) {}
  themeIcon();
};
themeIcon();
$('#scrim').onclick = function(){ closeDrawer(true); };
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') { if (!$('#menu').hidden) menuOpen(false); else if (DDM) closeDd(); else closeDrawer(true); } });
$('#mbtn').onclick = function(e){ e.stopPropagation(); menuOpen($('#menu').hidden); };
document.addEventListener('click', function(e){ if (!$('#menu').hidden && !e.target.closest('#menu,#mbtn')) menuOpen(false); });
// 링크(#insight 등)·주소창·뒤로 가기로 주소가 바뀌면 그 화면으로 — 화면 안의 이동(replaceState)은 이 이벤트를 만들지 않는다
window.addEventListener('hashchange', route);
window.addEventListener('popstate', route);

var p = decodeURIComponent(location.hash.slice(1)).split('/');
SITE_P = loadSite();   // MP 화면이 변경 기록 설정을 기다릴 수 있게 먼저 시작
go(p[0], p[1]);
SITE_P.then(function(){ siteChrome(); if (SECT[S.view]) render(); });
// 저장소(관리자 저장본)를 한 번 읽어 탭·관심 개수·MP 화면을 맞춘다 — 순위 화면은 기다리지 않는다
if (D.store && !LIVE) loadLive().catch(function(){ LIVE_ERR = true; }).then(function(){
  var vis = mpTabSync();
  if (S.view === 'mp' && !vis) go(LASTMK.stock);
  else if (S.view === 'mp' || S.mk === 'etf_pick' || S.mk === 'stock_pick') render();
  else { var pk = S.view === 'etf' ? 'etf_pick' : 'stock_pick', c = document.querySelector('#app .seg [data-mk="' + pk + '"]'), n = (pk === 'etf_pick' ? pickList() : watchList()).length;
    if (c) c.innerHTML = '관심' + (n ? '<span class="cnt">' + n + '</span>' : ''); }
});
})();
</script>
</body>
