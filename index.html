<script>
  // 첫 화면 깜빡임 없이 테마 적용 (저장값 > 시스템 설정)
  (function(){ var t; try { t = localStorage.getItem('theme'); } catch(e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t); })();
</script>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f0f2f5; --line:#e2e6ec; --line-2:#d3d9e2;
  --text:#0d1524; --text-2:#3f4b5e; --mute:#768397;
  --accent:#0f9d8a; --accent-ink:#0b7a6b; --accent-soft:rgba(15,157,138,.10);
  --pos:#12915c; --neg:#d0433f; --amber:#b7800a;
  --b-kr:#2563eb; --b-us:#d97706;                    /* 성과 차트 벤치마크 — 한국 · 미국 */
  --shadow:0 1px 2px rgba(13,21,36,.04),0 4px 16px rgba(13,21,36,.04);
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Pretendard Variable",Pretendard,"Malgun Gothic",monospace;
}
[data-theme=dark]{
  --bg:#0a0f1c; --surface:#0f1628; --surface-2:#141d33; --line:#1d2740; --line-2:#28344f;
  --text:#e8edf6; --text-2:#b4c0d4; --mute:#7c89a3;
  --accent:#2dd4bf; --accent-ink:#5eead4; --accent-soft:rgba(45,212,191,.11);
  --pos:#34d399; --neg:#f87171; --amber:#fbbf24;
  --b-kr:#60a5fa; --b-us:#f59e0b;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}
button{font:inherit;color:inherit}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.mute{color:var(--mute)} .pos{color:var(--pos)} .neg{color:var(--neg)}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
@media(min-width:768px){.wrap{padding:0 28px}}

/* ---------- top bar */
.bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;height:58px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.02em;white-space:nowrap}
/* 로고 = 사용자 프로필 그림(원본 바탕화면 photo_2026-07-10_15-45-21.jpg → ops/assets, 2026-09-23 교체) */
.mark{width:32px;height:32px;border-radius:50%;flex:none;display:block;object-fit:cover;box-shadow:0 0 0 1px var(--line)}
.bar .sp{flex:1}
.live{display:flex;align-items:center;gap:6px;font:500 11px/1 var(--mono);letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;background:var(--pos);box-shadow:0 0 0 3px color-mix(in srgb,var(--pos) 22%,transparent)}
.dot.warn{background:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 22%,transparent)}
.dot.bad{background:var(--neg);box-shadow:0 0 0 3px color-mix(in srgb,var(--neg) 22%,transparent)}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{border-color:var(--line-2)}
.iconbtn svg{width:17px;height:17px}
@media(max-width:520px){.live{display:none}}

/* ---------- hero */
.hero{display:grid;gap:16px;padding:28px 0 8px}
@media(min-width:900px){.hero{grid-template-columns:repeat(4,minmax(0,1fr));column-gap:14px;align-items:end;padding:44px 0 12px}
  .hero > div:first-child{grid-column:span 2}}
.eyebrow{font:600 11.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink)}
h1{font-size:clamp(34px,6vw,54px);line-height:1.02;letter-spacing:-.035em;margin:12px 0 14px;font-weight:750}
.updated{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;color:var(--text-2);font-size:14px}
.updated .num{color:var(--text);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);font-size:12.5px;color:var(--text-2)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);margin-top:20px}
.seg button{border:0;background:none;padding:8px 18px;border-radius:9px;cursor:pointer;color:var(--mute);font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.seg .cnt{font:500 11px var(--mono);margin-left:6px;color:var(--mute)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
/* 다음 거래일(관심 기간) — 카드 대신 제목 영역의 한 줄(2026-09-23). 한국·미국 같은 형식 '날짜 + 한국시간 범위', 설명은 title */
.pill.nx{flex-wrap:wrap;row-gap:2px}
.pill.nx > span{white-space:nowrap}
.pill.nx .k{font-weight:600;color:var(--accent-ink)}
.pill .amb{color:var(--amber)}
@media(max-width:640px){.pill.nx{border-radius:10px}}
.warnbox{margin:12px 0 0;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--amber) 12%,transparent);
  color:var(--amber);font-size:13px;border:1px solid color-mix(in srgb,var(--amber) 30%,transparent)}

/* ---------- 시장 기준지수 카드(index_cards.py, 2026-09-23) — 참고 표시, Score·순위와 무관.
   원래 NEXT SESSION 카드 자리에 선택한 시장 지수 4개를 2×2로. 900px↑은 제목 영역이 KPI와 같은 4열 격자라
   왼쪽 열 = 'Score 80+ 이탈' 카드 선, 오른쪽 열 = '최다 섹터' 카드 선(간격도 KPI와 같은 14px) */
.idx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;min-width:0}
@media(min-width:900px){.hero > .idx{grid-column:span 2;gap:14px}}
.ix{padding:11px 12px 10px;min-width:0}
.ix .n{font:600 11.5px/1.2 var(--sans);color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ix .v{font:600 16px/1.2 var(--mono);letter-spacing:-.02em;color:var(--text);margin-top:6px;white-space:nowrap}
.ix .f{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;margin-top:4px;min-height:20px}
.ix .c{font:500 12px/1 var(--mono);white-space:nowrap}
.isp{display:block;flex:none}
.isp .l{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.isp .a{fill:currentColor;opacity:.12}
@media(max-width:640px){.idx{gap:8px}.ix{padding:9px 11px}.ix .v{font-size:15px;margin-top:4px}}

/* ---------- sections */
section{margin-top:28px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.sh h2{margin:0;font:700 16px/1.2 var(--sans);letter-spacing:-.02em;color:var(--text);white-space:nowrap}
.sh h2 .en{font:600 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);margin-right:8px;vertical-align:2px}
.ko{font-family:var(--sans);letter-spacing:-.01em}
.sh .note{font-size:12.5px;color:var(--mute)}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:900px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}}
.kpi{padding:16px 18px 18px;min-width:0}

/* 인사이트 글 서식(post_format.js와 짝) — 공개 페이지와 관리자 미리보기 공용. publish_site.py가 두 템플릿의 PF_CSS 자리에 넣는다.
   색은 사이트 변수(--accent·--pos 상승 초록·--neg 하락 빨강 …)를 쓰고, 관리자 화면에 없는 변수는 뒤의 기본값으로. */

.prose h2,.prose h3,.prose h4,.prose h5{scroll-margin-top:84px;word-break:keep-all;overflow-wrap:break-word}
.prose ol{margin:0 0 1.1em;padding-left:1.5em}

.pf-cb.on{background:var(--accent);border-color:var(--accent)}

.prose li.pf-ti.done{color:var(--text-2,var(--mute))}

/* 박스: 핵심·참고·팁·주의·위험·확인·질문 */
.pf-box{--c:var(--accent);margin:0 0 1.2em;padding:13px 16px 14px;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;background:var(--surface-2,var(--surface))}

.pf-box.pf-note{--c:#3b6fd8}.pf-box.pf-tip{--c:#12915c}.pf-box.pf-key{--c:var(--accent)}.pf-box.pf-warn{--c:#c27c0e}

      return '<div class="pf-stats">' + inner.filter(function(x){ return x.trim(); }).map(function(x){
        var p = cells(x.indexOf('|') >= 0 ? x : x + '|'), d = p[2] || '';
        return '<div class="pf-st"><span class="l">' + inline(p[0] || '', C) + '</span><span class="v">' + inline(p[1] || '', C) + '</span>'
          + (d ? '<span class="d' + sgnCls(d) + '">' + inline(d, C) + '</span>' : '') + '</div>'; }).join('') + '</div>';
    }
    if (k === '일정' || k === '캘린더' || k === 'schedule' || k === 'calendar') {   // 날짜 | 일 | 예상 | 이전 … — 머리 없는 표
      return '<div class="pf-tbl pf-sched"><table><tbody>' + inner.filter(function(x){ return x.trim(); }).map(function(x){
        return '<tr>' + cells(x.indexOf('|') >= 0 ? x : x + '|').filter(function(c, i, a){ return c || i < a.length - 1; }).map(function(c, i){
          return '<td' + (i === 0 ? ' class="pf-sd"' : sgnCls(c) ? ' class="' + sgnCls(c).trim() + '"' : '') + '>' + inline(c, C) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
    }
    var b = own(BOX, k) ? BOX[k] : null;
    if (b) return box(/[가-힣]/.test(type) && !title ? [b[0], type] : b, title, inner, C);
    return null;   // 모르는 이름 — 글자 그대로
  }
  function box(b, title, inner, C){
    if (b[0] === 'quote') return '<blockquote class="pf-quote">' + blocks(inner, C) + (title ? '<footer>— ' + inline(title, C) + '</footer>' : '') + '</blockquote>';
    return '<div class="pf-box pf-' + b[0] + '"><div class="pf-bt">' + inline(title || b[1], C) + '</div><div class="pf-bb">' + blocks(inner, C) + '</div></div>';
  }

  function blocks(L, C){
    if ((C.depth = (C.depth || 0) + 1) > 24) { C.depth--; return '<p>' + E(L.join(' ')) + '</p>'; }
    var out = [], para = [], i = 0;
    function fp(){ if (para.length) { out.push('<p>' + para.map(function(x){ return inline(x, C); }).join('<br>') + '</p>'); para = []; } }
    while (i < L.length) {
      var ln = L[i], s = ln.trim(), m;
      if (!s) { fp(); i++; continue; }
      if ((m = ln.match(FENCE))) {
        fp(); var code = [], j = i + 1;
        while (j < L.length && !/^\s*```/.test(L[j])) { code.push(L[j]); j++; }
        out.push('<pre class="pf-code"><code>' + E(code.join('\n')) + '</code></pre>'); i = j + 1; continue;
      }
      if ((m = ln.match(CONT))) {
        var cj = closeOf(L, i), h = container(m[1], m[2], L.slice(i + 1, cj), C);
        if (h != null) { fp(); out.push(h); i = cj + 1; continue; }
      }
      if (TOC.test(ln)) { fp(); out.push('\uE003TOC\uE003'); C.toc = true; i++; continue; }
      if ((m = headOf(ln))) {
        fp(); var lv = Math.min(m[0].length, 4) + 1, id = C.pre + 'h-' + (++C.hN), txt = m[1];
        C.heads.push({lv: lv, id: id, text: txt});
        out.push('<h' + lv + ' id="' + id + '">' + inline(txt, C) + '</h' + lv + '>'); i++; continue;
      }
      if (HR.test(ln)) { fp(); out.push('<hr>'); i++; continue; }
      if (isTableStart(L, i)) { fp(); var tb = table(L, i, C); out.push(tb[0]); i = tb[1]; continue; }
      if (/^\s{0,3}>/.test(ln)) {
        fp(); var q = [], j2 = i;
        while (j2 < L.length && /^\s{0,3}>/.test(L[j2])) { q.push(L[j2].replace(/^\s{0,3}>\s?/, '')); j2++; }
        var am = q.length && q[0].match(/^\s*\[!([^\]\s]{1,30})\]\s*(.*)$/), ak = am && am[1].toLowerCase().replace(/[\s_-]/g, ''), bt = am && own(BOX, ak) ? BOX[ak] : null;
        out.push(bt ? box(bt, am[2], q.slice(1), C) : '<blockquote>' + blocks(q, C) + '</blockquote>');
        i = j2; continue;
      }
      if (LI.test(ln)) { fp(); var ls = list(L, i, C); out.push(ls[0]); i = ls[1]; continue; }
      if (IMGLINE.test(ln)) {
        fp(); var ims = [], rx = /!\[([^\]\n]{0,300})\]\(([^)\s]{1,2000})(?:\s+"([^"\n]{0,300})")?\)/g, im;
        while ((im = rx.exec(ln))) ims.push(imgTag(im[1], im[2], im[3] || '', C, false));
        out.push(ims.length > 1 ? '<div class="pf-gal pf-gal-' + Math.min(ims.length, 4) + '">' + ims.join('') + '</div>' : ims[0]); i++; continue;
      }
      if ((m = ln.match(YT))) {
        fp(); out.push('<div class="pf-yt"><iframe src="https://www.youtube-nocookie.com/embed/' + m[1] + '" title="YouTube 영상" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>');
        i++; continue;

  }

  // ------------------------------------------------------------ 전체
  var FNDEF = /^\s{0,3}\[\^([^\]\s]{1,24})\]:\s*(.*)$/;
  // 참고한 자료(2026-10-08 사용자 지시 — '주석' 대신, 링크는 깔끔하게). 각주 하나 = 자료 줄 몇 개 + 작은 메모.
  // ① [글](주소) 형식: 줄마다 한 자료, 줄이 '메모:'로 시작하면 메모. ② 예전 맨 주소 형식('출처: 매체 날짜 주소 · … . 메모')은 주소 앞 글자를 링크 이름으로, 그 밖의 글은 메모로 풀어 쓴다.
  var SITE_ROOT = 'https://juniorhan.github.io/juniorhanpb/';
  function refA(u, label){
    var inner = u.indexOf(SITE_ROOT + '#') === 0;
    return '<a href="' + E(inner ? u.slice(SITE_ROOT.length) : u) + '"' + (inner ? '' : ' target="_blank" rel="noopener nofollow"') + '>' + E(label) + '</a>';
  }
  function refHost(u){ var m = String(u).match(/^https?:\/\/(?:www\.)?([^\/?#]+)/i); return m ? m[1] : u; }
  function refNote(s, C){ s = String(s).replace(/^[\s.·,;:]+/, '').replace(/\s+$/, ''); return s ? '<div class="pf-note">' + inline(s, C) + '</div>' : ''; }
  function refHtml(raw, C){
    var t = String(raw).replace(/^\s*출처\s*[:：]\s*/, '');
    if (/\]\(/.test(t) || !/https?:\/\//i.test(t)) {
      return t.split('\n').map(function(ln){ ln = ln.trim(); if (!ln) return '';
        var m = ln.match(/^(?:메모|참고)\s*[:：]\s*(.*)$/);
        return m ? refNote(m[1], C) : '<div class="pf-ref">' + inline(ln, C) + '</div>'; }).join('');
    }
    t = t.replace(/\n+/g, ' ');
    var hits = [], m, re = new RegExp(URLX.source, 'g');
    while ((m = re.exec(t))) { var x = urlCut(m[0]); if (!/^https?:\/\/[^\/\s]/i.test(x[0])) continue; hits.push({i: m.index, u: x[0]}); re.lastIndex = m.index + x[0].length; }
    if (!hits.length) return '<div class="pf-ref">' + inline(t, C) + '</div>';
    var out = [], cur = null, pos = 0;
    hits.forEach(function(h){
      var gap = t.slice(pos, h.i), cut = gap.lastIndexOf(' · '), label = '', fresh;
      if (cut >= 0) { if (cur) cur.note += gap.slice(0, cut); else out.push({note: gap.slice(0, cut)}); label = gap.slice(cut + 3); fresh = true; }

      pos = h.i + h.u.length;
    });
    if (cur) cur.note += t.slice(pos);

      if (!o.urls) return refNote(o.note, C);
      if (o.label.length > 34) { o.note = o.label + ' ' + o.note; o.label = ''; }   // 이름이 문장처럼 길면 주소 도메인을 이름으로, 글은 메모로
      return '<div class="pf-ref">' + o.urls.map(function(u, j){ return refA(u, j ? '원문 ' + (j + 1) : (o.label || refHost(u))); }).join(' ') + '</div>' + refNote(o.note, C);

  }
  function render(text, opt){

    var src = String(text == null ? '' : text).replace(/\r\n?/g, '\n').replace(/[\uE000-\uE004\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, '');   // \uBCF4\uAD00 \uD45C\uC2DC\uC6A9 \uAE00\uC790\u00B7\uC81C\uC5B4 \uBB38\uC790 \uC81C\uAC70

        var n = C.fnNo[id];

      var hs = C.heads.filter(function(h){ return h.lv <= 4; }), top = Math.min.apply(null, hs.map(function(h){ return h.lv; }).concat([9]));

  }

  // 목록 요약·검색용 일반 글자(소제목·표 구분선·각주 정의·꾸밈 기호 제거). noHeads = 소제목 줄 빼기
  function plain(text, opt){

    String(text == null ? '' : text).replace(/\r\n?/g, '\n').split('\n').forEach(function(ln){
      if (FENCE.test(ln)) { fence = !fence; return; }

      if (fn && /^\s{2,}\S/.test(ln)) return;
      fn = FNDEF.test(ln);
      if (fn || CONT.test(ln) || CEND.test(ln) || HR.test(ln) || isSep(ln) || TOC.test(ln) || YT.test(ln) || /^\s*\+\+\+\s*$/.test(ln)) return;

    });

      .replace(/!\[([^\]]{0,300})\]\([^)]{0,2000}\)/g, ' ')
      .replace(/\[([^\]]{1,300})\]\([^)\s]{0,2000}(\s+"[^"]{0,300}")?\)/g, '$1')
      .replace(/\[\^[^\]\s]{1,24}\]/g, '')
      .replace(/\[\[([^\[\]\n|]{1,40})(?:\|([^\[\]\n]{1,40}))?\]\]/g, function(m, q, lab){ return tname(q.trim(), lab ? lab.trim() : ''); })
      .replace(/(^|[^\w$&;\\])\$([0-9]{6}|[A-Z]{1,5}(?:[.\-][A-Z]{1,2})?)(?![\w])/g, function(m, pre, sym){ return pre + tname(sym, ''); })
      .replace(DECO_RX, '$2')
      .replace(/\\([\\`*_{}\[\]()#+\-.!|~=^>:$<])/g, '$1')
      .replace(/\*\*(?=[^\s*])([^\n]{0,1000}?[^\s*])\*\*/g, '$1').replace(/(^|[^\w가-힣])__(?=\S)([^\n]{0,1000}?\S)__(?![\w가-힣])/g, '$1$2')
      .replace(/~~(?=[^\s~])([^~\n]*?[^\s~])~~/g, '$1').replace(/(^|[^\w=가-힣])==(?=[^\s=])([^=\n]*?[^\s=])==(?!=)/g, '$1$2')
      .replace(/(^|[^\w+])\+\+(?=[^\s+])([^+\n]*?[^\s+])\+\+(?![\w+])/g, '$1$2').replace(/`([^`]{1,300})`/g, '$1')
      .replace(/(^|[\s(])[*_]([^*_\s][^*_]*?)[*_](?=[\s).,!?]|$)/g, '$1$2')
      .replace(/\s\|\s/g, ' ').replace(/<br\s*\/?>/gi, ' ')
      .replace(/\s+/g, ' ').trim();
  }

  function info(text){

    return {chars: p.length, minutes: Math.max(1, Math.round(p.length / 500)), heads: R.heads, images: (String(text || '').match(/!\[[^\]\n]*\]\([^)\s]+/g) || []).length};
  }

  var SPEC = [

    ['제목', '# 큰 제목 / ## 소제목 / ### 작은 제목', '# 하나가 가장 큽니다(글 제목 아래 단계)'],
    ['굵게', '**굵게**', 'Ctrl+B'],

    ['취소선', '~~취소선~~', ''],

    ['글자색', '{빨강:글자} {파랑:글자} {초록:글자} {주황:글자} {보라:글자} {회색:글자} {상승:+3.2%} {하락:-1.5%}', '상승·하락은 사이트 색(오름 초록·내림 빨강)'],

    ['핵심 숫자', ':::숫자\nKOSPI | 7,003 | +0.46%\n환율 | 1,347원 | -0.92%\n:::', '이름 | 값 | 변화(선택)'],
    ['표', '| 항목 | 값 |\n|---|---:|\n| 매출 | 1,200억 |', '정렬: :--- 왼쪽, :---: 가운데, ---: 오른쪽. 숫자 열은 자동 오른쪽, +/- 숫자는 색'],
    ['구분선', '---', ''],
    ['링크', '[보일 글자](https://주소)', '주소만 적어도 자동 링크. 첨부 파일은 [보고서](files/파일이름.pdf)'],
    ['이미지', '![설명](files/파일이름.png)\n![설명|작게](https://…/그림.png "캡션")', '첨부 파일 이름이나 https 주소. 크기: 작게·중간·크게. 한 줄에 여러 개 = 나란히'],

    ['각주', '본문[^1]\n[^1]: 출처·설명', '번호가 자동으로 붙고 글 끝 \'참고한 자료\'에 모입니다'],

  return {render: render, html: function(t, o){ return render(t, o).html; }, plain: plain, info: info, esc: E, SPEC: SPEC, BOX: BOX};
})();

// ---------- 형식
function f1(v){ return isNum(v) ? Number(v).toFixed(1) : '–'; }

  return v >= 1e9 ? '$' + (v / 1e9).toFixed(big && v >= 1e11 ? 0 : 2) + 'B' : '$' + Math.round(v / 1e6) + 'M'; }

function pill(l){ var x = LB[l]; return l ? '<span class="lb lb-' + (x ? x.c : 'mix') + '" title="' + esc((x ? x.g + ' · ' : '') + l) + '">' + esc(lko(l)) + '</span>' : '–'; }

// ---------- 순위 추이 (전체 순위, 위쪽이 1위 — 참고용, 선정 기준 아님)
function spark(a, w, h){
  if (!a || !a.some(function(v){ return v != null; })) return '<span class="mute">–</span>';
  var vals = a.filter(function(v){ return v != null; });
  var mx = Math.max(25, Math.max.apply(null, vals)), n = a.length, p = 3;
  var x = function(i){ return n === 1 ? w / 2 : p + i * (w - 2 * p) / (n - 1); };

  var d = '', pen = false, last = -1;
  a.forEach(function(v, i){ if (v == null) { pen = false; return; } d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' '; pen = true; last = i; });
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" aria-hidden="true">'
    + '<path class="sp-ln" d="' + d + '"/>'
    + '<circle class="sp-dt" r="2.3" cx="' + x(last).toFixed(1) + '" cy="' + y(a[last]).toFixed(1) + '"/></svg>';
}

// ---------- 시장 기준지수 카드(D.indices = index_cards.py 파일, 시장별 사이트 기준일). 과거 날짜를 봐도 최신 기준일 고정(KPI 카드와 같음)
// 순서 = 2×2의 왼쪽 위 · 오른쪽 위 · 왼쪽 아래 · 오른쪽 아래 (사용자 지정). [키, 표시 이름, 한글 이름(title)]

var IDX = {korea: [['KOSPI', 'KOSPI', '코스피 종합'], ['KOSDAQ', 'KOSDAQ', '코스닥 종합'], ['USDKRW', '원/달러 환율', '원/달러 환율(USD/KRW)'], ['GOLD', '국제 금', '국제 금(COMEX 금 선물 · 달러/트로이온스)']],

// 최근 종가 추이선 — 값이 2개 미만이면 그리지 않는다. 색 = 전일 대비 등락률 방향(숫자와 같은 색)
function ispark(a, w, h, chg){
  var v = (a || []).filter(isNum).map(Number), n = v.length; if (n < 2) return '';
  var mn = Math.min.apply(null, v), r = (Math.max.apply(null, v) - mn) || 1, p = 2;
  var x = function(i){ return (p + i * (w - 2 * p) / (n - 1)).toFixed(1); };
  var y = function(t){ return (p + (1 - (t - mn) / r) * (h - 2 * p)).toFixed(1); };
  var d = v.map(function(t, i){ return (i ? 'L' : 'M') + x(i) + ' ' + y(t); }).join(' ');
  return '<svg class="isp ' + ((isNum(chg) ? chg : v[n - 1] - v[n - 2]) >= 0 ? 'pos' : 'neg') + '" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" aria-hidden="true">'
    + '<path class="a" d="' + d + ' L' + x(n - 1) + ' ' + h + ' L' + x(0) + ' ' + h + ' Z"/><path class="l" d="' + d + '"/></svg>';
}
function idxCards(mk){
  var L = IDX[mk]; if (!L) return '<div></div>';
  var f = (D.indices || {})[mk], all = (f && f.indices) || [], asof = (f && f.data_date) || '';
  return '<div class="idx">' + L.map(function(k){
    var c = all.filter(function(x){ return x.key === k[0]; })[0];

var GRACE_MS = 30 * 60 * 1000;     // 예상 시각을 30분 넘겨도 안 바뀌었으면 '지연'
function kstDay(t){ return new Intl.DateTimeFormat('en-CA', {timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit'}).format(t); }
function kstHM(t){ return new Intl.DateTimeFormat('en-GB', {timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'}).format(t); }
function relDay(t){
  var now = new Date(), d = kstDay(t);
  if (d === kstDay(now)) return '오늘';
  if (d === kstDay(new Date(now.getTime() + 864e5))) return '내일';
  var p = d.split('-');
  return (+p[1]) + '/' + (+p[2]) + '(' + new Intl.DateTimeFormat('ko-KR', {timeZone: 'Asia/Seoul', weekday: 'short'}).format(t) + ')';
}
function nextUpd(m){
  if (!m.next || !m.next.at || !m.next.at.length) return null;

function statusOf(m){

  var nu = nextUpd(m);
  if (nu && nu.stale) return ['warn', '갱신 지연'];
  if (m.status === 'OK') return ['', '정상'];
  if (m.status === 'DEGRADED') return ['warn', '휴장 또는 1영업일 지연'];

    else if (hs.mk && (hs.mk !== PEEK.mk || hs.t !== PEEK.t)) { peek(hs.mk, hs.t, true); return; }   // 덮어 본 상세 위의 상세에서 뒤로 = 아래 상세
  }
  var q = hashGo(location.hash), k = q[0], t = q[1] || '', open = document.body.classList.contains('open');
  if (SECT[k]) { if (S.view !== k || (S.sp || '') !== t) { var fl = k === 'insight' && t && S.view === 'insight' && !S.sp; go(k, q[1]); backY(sy);
      if (fl) history.replaceState(Object.assign({}, history.state, {fl: 1}), ''); } return; }
  if (k === 'mp') { if (S.view !== 'mp') { go('mp'); backY(sy); } return; }
  // MP 화면은 S.mk(마지막 시장)를 그대로 두므로 MP에서 그 시장 주소로 바뀐 경우도 이동한다(2026-10-04)
  if (SECT[S.view] || S.view === 'mp' || k !== S.mk) { go(k, q[1]); backY(sy); return; }
  // 같은 시장 — 상세만 주소·기록에 맞춘다
  if (t) { if ((!open || DRT !== t) && cur && cur.by[t]) openDrawer(t, false); }
  else if (open && !(history.state && history.state.dr)) closeDrawer(false);
}

function go(k, t){
  menuOpen(false);
  if (SECT[k]) { S.view = k; closeDrawer(false); renderSect(k, t); window.scrollTo(0, 0); return; }   // Insight · About · Connect(D-18)
  if (k === 'mp' && !mpTabSync()) k = LASTMK.stock;   // 공개 끔이면 탭을 숨기고 주식으로
  if (k === 'mp') { S.view = 'mp'; closeDrawer(false); render(); window.scrollTo(0, 0); return; }
  if (k === 'etf_pick') { S.view = 'etf'; S.mk = k; LASTMK.etf = k; closeDrawer(false); setHash(null); renderEtfPick(); return; }   // setHash: 불러오는 중에도 주소를 먼저(뒤로 가기 기록)
  if (k === 'stock_pick') { S.view = 'stock'; S.mk = k; LASTMK.stock = k; closeDrawer(false); setHash(null); renderStockPick(); return; }
  if (!MK[k] && !ESTUB[k]) k = D.markets[0].key;
  if (isEtfKey(k) && !MK[k]) {               // ETF 자료는 처음 열 때 불러온다
    S.view = 'etf'; tabsSync(); closeDrawer(false);
    if (hashGo(location.hash)[0] !== k) history.replaceState(null, '', '#' + k + (t ? '/' + encodeURIComponent(t) : ''));   // 불러오는 중에도 주소를 먼저(뒤로 가기 기록)
    $('#live').innerHTML = '<span class="dot"></span>' + esc(mkLabel(k));
    $('#app').innerHTML = '<div class="hero"><div><div class="eyebrow">RS Tracker</div><h1>' + esc(mkName(ESTUB[k].name)) + '</h1></div></div><section>' + segHtml({key: k}) + '<div class="card empty" id="eload">불러오는 중…</div></section>';
    document.querySelectorAll('#app .seg [data-mk]').forEach(function(b){ b.onclick = function(){ navDo(function(){ go(b.dataset.mk); }); }; });
    fetch('data/' + k + '/main.json', {cache: 'no-cache'}).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(j){ MK[k] = j; (D.suspended = D.suspended || {})[k] = j.susp || []; (D.suspended_note = D.suspended_note || {})[k] = j.susp_note || [];
        if (S.view === 'etf' && hashGo(location.hash)[0] === k) go(k, t); })   // 불러오는 동안 다른 화면으로 갔으면 그대로
      .catch(function(){ var e = $('#eload'); if (e) e.textContent = 'ETF 자료를 불러오지 못했습니다.'; });
    return;
  }
  if (S.mk !== k) { S.mk = k; S.q = ''; S.sel = false; S.liq = null; S.vr = null; S.labels = {}; S.ind = null; S.gi = null; S.iall = false; S.sk = 'pos'; S.sd = 1; S.date = null; S.pall = false; S.rep = false; S.top = false; }
  S.view = isEtfKey(k) ? 'etf' : 'stock'; LASTMK[S.view] = k;
  cur = prep(MK[k]);
  closeDrawer(false);
  render();
  if (t && cur.by[t]) openDrawer(t, true); else setHash(null);   // true = 주소에 종목 표시(이미 같으면 그대로) — MP 추천 종목에서 ETF로 넘어갈 때 주소가 #mp로 남던 것(2026-10-03)
}
mpTabSync();
document.querySelectorAll('#tabs button').forEach(function(b){ b.onclick = function(){
  var v = b.dataset.view; if (v === S.view && v !== 'mp') return;
  navDo(function(){ go(v === 'mp' ? 'mp' : LASTMK[v]); }); window.scrollTo(0, 0); }; });

function themeIcon(){ var d = document.documentElement.getAttribute('data-theme') === 'dark'; $('#theme').innerHTML = d ? ICON_SUN : ICON_MOON; }
$('#theme').onclick = function(){
  var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('theme', t); } catch (e) {}
  themeIcon();
};
themeIcon();
$('#scrim').onclick = function(){ closeDrawer(true); };
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') { if (lbClose(true)) return; if (!$('#menu').hidden) menuOpen(false); else if (DDM) closeDd(); else closeDrawer(true); } });
$('#mbtn').onclick = function(e){ e.stopPropagation(); menuOpen($('#menu').hidden); };
document.addEventListener('click', function(e){ if (!$('#menu').hidden && (!e.target.closest('#menu,#mbtn') || e.target.closest('#menu a'))) menuOpen(false); });
document.addEventListener('click', function(e){   // 화면 안 링크로 떠날 때 위치를 남긴다(뒤로 가기 = 그 위치) · '← 인사이트'는 목록에서 왔으면 뒤로 가기
  var a = e.target.closest('a[href^="#"]'); if (!a) return;
  if (a.classList.contains('back') && history.state && history.state.fl) { e.preventDefault(); history.back(); return; }
  if (!e.defaultPrevented) history.replaceState(Object.assign({}, history.state, {y: window.scrollY}), '');
}, true);
// 휴대폰(마우스 없음)에서는 title 설명이 안 보인다 — 표 머리글·배지·지수 카드 등을 누르면 아래에 잠깐 띄운다(2026-10-05)
var TIPT = null;
if (window.matchMedia && matchMedia('(hover: none)').matches) document.addEventListener('click', function(e){
  var el = e.target.closest('th[title],.card.ix[title],.pill.nx[title],.st[title],sup.gp[title],.nu[title],.gtag[title],.tn[title]'); if (!el) return;
  if (!el.closest('th')) e.stopPropagation();   // 줄 안의 배지 = 설명만(상세는 줄의 다른 곳)
  var tp = $('#tip'); if (!tp) { tp = document.createElement('div'); tp.id = 'tip'; tp.className = 'tip'; tp.setAttribute('role', 'status'); document.body.appendChild(tp); }
  tp.textContent = el.getAttribute('title'); tp.hidden = false; clearTimeout(TIPT); TIPT = setTimeout(function(){ tp.hidden = true; }, 4000);
}, true);
function hh(){ var b = document.querySelector('header.bar'); if (b) document.documentElement.style.setProperty('--hh', Math.ceil(b.getBoundingClientRect().height) + 'px'); }
hh(); window.addEventListener('resize', hh);
$('#drawer').inert = true;
// 링크(#insight 등)·주소창·뒤로 가기로 주소가 바뀌면 그 화면으로 — 화면 안의 이동(replaceState)은 이 이벤트를 만들지 않는다
window.addEventListener('hashchange', route);
window.addEventListener('popstate', route);
// 글 안의 목차·각주(주소를 바꾸지 않고 그 자리로) · 이미지 크게 보기(뒤로 가기 = 닫기)
document.addEventListener('click', function(e){
  var g = e.target.closest('[data-pf-go]');
  if (g) { e.preventDefault(); var el = document.getElementById(g.getAttribute('data-pf-go'));
    if (el) { for (var dt = el.parentElement; dt; dt = dt.parentElement) if (dt.tagName === 'DETAILS') dt.open = true;   // 접힌 상자 안의 제목·각주면 펼친다
      el.scrollIntoView({behavior: 'smooth', block: 'start'}); el.classList.remove('pf-flash'); void el.offsetWidth; el.classList.add('pf-flash'); } return; }
  var tk = e.target.closest('.prose a.pf-tk[href^="#"]');   // 글 안 종목 → 글 위에 상세(2026-10-05)
  if (tk) { var tq = hashGo(tk.getAttribute('href')); if (peek(tq[0], tq[1])) { e.preventDefault(); return; } }
  var im = e.target.closest('.prose .pf-fig img, .att img');
  if (im && !im.closest('a')) { e.preventDefault(); lbOpen(im); }
});
function lbOpen(im){
  var b = $('#lbx');
  if (!b) { b = document.createElement('div'); b.id = 'lbx'; b.className = 'lbx'; b.hidden = true; b.setAttribute('role', 'dialog'); b.setAttribute('aria-modal', 'true'); b.setAttribute('aria-label', '이미지 크게 보기');
    b.innerHTML = '<img alt=""><button type="button" aria-label="닫기">×</button>'; b.onclick = function(){ lbClose(true); }; document.body.appendChild(b); }
  var i = b.querySelector('img'); i.src = im.currentSrc || im.src; i.alt = im.alt || '';
  if (b.hidden) { b.hidden = false; document.body.classList.add('lbon'); history.pushState({lb: 1}, '', location.href); }
}
function lbClose(back){
  var b = $('#lbx'); if (!b || b.hidden) return false;
  b.hidden = true; document.body.classList.remove('lbon');
  if (back && history.state && history.state.lb) history.back();
  return true;
}
window.addEventListener('popstate', function(){ lbClose(false); });

var p = hashGo(location.hash);
SITE_P = loadSite();   // MP 화면이 변경 기록 설정을 기다릴 수 있게 먼저 시작
go(p[0], p[1]);
SITE_P.then(function(){ siteChrome(); if (SECT[S.view]) render(); });
// 저장소(관리자 저장본)를 한 번 읽어 탭·관심 개수·MP 화면을 맞춘다 — 순위 화면은 기다리지 않는다
if (D.store && !LIVE) loadLive().catch(function(){ LIVE_ERR = true; }).then(function(){
  var vis = mpTabSync();
  if (S.view === 'mp' && !vis) go(LASTMK.stock);
  else if (S.view === 'mp' || S.mk === 'etf_pick' || S.mk === 'stock_pick') render();
  else { var pk = S.view === 'etf' ? 'etf_pick' : 'stock_pick', c = document.querySelector('#app .seg [data-mk="' + pk + '"]'), n = (pk === 'etf_pick' ? pickList() : watchList()).length;
    if (c) c.innerHTML = '관심' + (n ? '<span class="cnt">' + n + '</span>' : ''); }
});
})();
</script>
