<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>투자노트 관리</title>
<!-- 관리자 화면 — MP 구성·관심 ETF를 저장소(Firestore 문서 하나)에 쓴다. 사이트 링크 없음.
     D-14(2026-09-25): 로그인 = Firebase 이메일/비밀번호 계정, 쓰기 허용 = 보안 규칙의 관리자 UID 하나. 이 파일에는 공개 식별자(apiKey·projectId)만.
     D-15(2026-09-25): 입력 폼 → 운용 화면. 행동 하나(편입·편출·비중 조절)마다 '오늘 적용일' 하나에 합쳐 바로 저장한다.
       저장 형식은 그대로(rows = 적용일별 전체 구성, picks) + exits(편출사유, 계산에는 안 씀).
       과거 적용일(오늘 이전)의 종목·비중은 저장 직전 검사로 막는다 — 추천사유·편출사유·표시 이름만 고칠 수 있다.
       추천가는 입력받지 않는다 — 추천일 정규장 종가를 계산(mp_user.py)이 자동으로 쓴다. -->
<style>
:root{--bg:#f5f6f8;--surface:#fff;--text:#111827;--mute:#6b7280;--line:#e3e6ea;--accent:#0f766e;--neg:#dc2626;--pos:#059669;--amber:#b45309;--in:#fff;--soft:#f0f4f4}
@media (prefers-color-scheme:dark){:root{--bg:#0c1015;--surface:#151b22;--text:#e6e8eb;--mute:#98a2b0;--line:#2a3441;--accent:#2dd4bf;--neg:#f87171;--pos:#34d399;--amber:#fbbf24;--in:#0f141a;--soft:#1b242d}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding-bottom:60px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
header b{font-size:15px}
header .sp{flex:1}
a{color:var(--accent)}
main{max-width:1040px;margin:0 auto;padding:14px 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}
.mute{color:var(--mute)}
.small{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.err{color:var(--neg)}
.okc{color:var(--pos)}
.warn{color:var(--amber)}
.pos{color:var(--pos)}.neg{color:var(--neg)}   /* 사이트 규칙: 상승 초록 · 하락 빨강 */
h2{font-size:15px;margin:0 0 8px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;min-width:0;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--in)}
input[aria-invalid=true],textarea[aria-invalid=true]{border-color:var(--neg)}
textarea{min-height:64px;resize:vertical}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;white-space:nowrap}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.dng{color:var(--neg)}
button:disabled{opacity:.45;cursor:default}
button.lnk{border:0;background:none;padding:0;color:var(--accent);font-size:12px}
.seg{display:flex;gap:4px;background:var(--line);padding:3px;border-radius:10px;margin:0 0 12px}
.seg button{flex:1;border:0;background:none;font-weight:600;color:var(--mute);padding:7px 6px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chips button{border-radius:999px;padding:4px 11px;font-size:13px}
.chips button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);font-weight:600}
.chip{display:inline-block;font-size:11px;line-height:1.6;padding:0 6px;border-radius:999px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.help{font-size:12.5px;color:var(--mute);margin:6px 0 0}
.kpi{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:baseline;margin:0 0 12px}
.kpi b{font-size:18px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button{font-weight:600}
/* 현재 구성 — PC는 표, 휴대폰은 카드(같은 요소, CSS만 다름) */
.hl{display:grid;grid-template-columns:minmax(0,1fr) 78px 96px 96px 72px 76px 54px 66px 168px;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.hl.hd{font-size:12px;color:var(--mute);border-top:0;padding:0 0 6px}
.hl .r{text-align:right}
.c-nm{min-width:0}
.c-nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.c-nm .sub{font-size:12px;color:var(--mute)}
.c-w b{font-size:14px}
.c-a{display:flex;gap:4px;justify-content:flex-end}
.c-a button{padding:5px 8px;font-size:12.5px}
.det{grid-column:1/-1;background:var(--soft);border-radius:8px;padding:10px 12px;font-size:12.5px}
.memo{white-space:pre-line}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px}
.kv span:nth-child(odd){color:var(--mute)}
.today{border-color:var(--accent)}
ul.dl{margin:6px 0 0;padding-left:18px}
ul.dl li{margin:3px 0}
.vh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 4px}
.lock{font-size:12px;color:var(--mute)}
.login{max-width:360px;margin:40px auto}
.login label{display:block;margin:0 0 10px;font-size:12.5px;color:var(--mute)}
.star{border:0;background:none;padding:2px 3px;font-size:19px;line-height:1;color:var(--mute);flex:none}
.star[aria-pressed=true]{color:var(--amber)}
.nmr{display:flex;align-items:center;gap:2px;min-width:0}
.nmr b{min-width:0}
.wl{display:grid;grid-template-columns:30px minmax(0,1fr) 190px 96px 136px;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.wl .c-a{justify-content:flex-end}
.w-n{min-width:0}
.w-n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-n .sub{font-size:12px;color:var(--mute)}
.w-m{text-align:right}
.wi{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px 8px;align-items:center;padding:8px 2px;border-top:1px solid var(--line)}
.wi .m1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wi .m2{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wi .rk{font-size:12px;text-align:right;white-space:nowrap}
.mpin{font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap}
#wres .wi:first-child{margin-top:8px}
#nlw{max-width:1040px;margin:0 auto;padding:14px 16px 0}
#nlw .card{margin:0}
.nl form{display:flex;gap:6px;margin-top:6px}
.nl form input{flex:1;min-width:0}
.nl-log{max-height:46vh;overflow:auto;margin:6px 0 0;overscroll-behavior:contain}
.nl-log:empty{display:none}
.nm{margin:8px 0;font-size:13.5px;overflow-wrap:anywhere}
.nm.me{text-align:right}
.nm.me span{display:inline-block;background:var(--soft);border-radius:10px;padding:5px 10px;max-width:90%;text-align:left;white-space:pre-wrap}
.nm.sys{border-left:3px solid var(--line);padding:2px 0 2px 10px}
.nm.q{border-left-color:var(--amber)}.nm.ok{border-left-color:var(--pos)}.nm.bad{border-left-color:var(--neg)}.nm.pv{border-left:0;padding:0}
.pv{border:1px solid var(--accent);border-radius:10px;padding:10px 12px}
.pv ol{margin:6px 0;padding-left:20px}
.pv li{margin:5px 0}
.nb{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.nb button{white-space:normal;text-align:left}
.nt{width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0}
.nt td{padding:3px 8px 3px 0;border-top:1px solid var(--line);vertical-align:top}
.nt td.r{text-align:right;white-space:nowrap}
.mk{color:var(--mute)}
.mk.hit{color:var(--neg);font-weight:600}
/* 창(편입·편출·비중 조절·사유) — 휴대폰은 전체 화면 */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:14px;width:100%;max-width:720px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.sh-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sh-h b{flex:1;font-size:15px;min-width:0}
.sh-h .x{border:0;padding:4px 8px;font-size:16px}
.sh-b{padding:12px 14px;overflow:auto;flex:1;min-height:0}
.sh-f{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sh-f .st{flex:1 1 180px;min-width:0;font-size:13px}
.it{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:4px 8px;align-items:start;padding:9px 2px;border-top:1px solid var(--line);cursor:pointer}
.it input[type=checkbox]{width:18px;height:18px;margin:3px 0 0;padding:0}
.it .m1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .m2{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .rk{font-size:12px;text-align:right;white-space:nowrap}
.it[aria-disabled=true]{cursor:default}
.it[aria-disabled=true] .m1{color:var(--mute)}
.it .more{grid-column:2/-1;background:var(--soft);border-radius:8px;padding:8px 10px;font-size:12.5px;cursor:default}
.direct{padding:10px 2px;border-top:1px solid var(--line);font-size:13px}
.direct button{margin:6px 6px 0 0}
.selbar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.selbar button{border-radius:999px;padding:3px 10px;font-size:12.5px;border-color:var(--accent);color:var(--accent)}
.opt{display:block;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;cursor:pointer}
.opt input[type=radio]{width:auto;margin:0 6px 0 0;vertical-align:-2px}
.opt[data-on=true]{border-color:var(--accent);background:var(--soft)}
.opt .in{display:flex;gap:8px;align-items:center;margin:8px 0 0 22px;flex-wrap:wrap;font-size:13px}
.opt .in input{width:110px}
.wbox{position:relative;display:inline-block}
.wbox input{padding-right:24px;text-align:right}
.wbox span{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--mute);font-size:12px}
.nw{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.nw .wbox{width:120px}
.nw .wbox input{width:120px}
.rs{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px}
.rs .cnt{font-size:12px;color:var(--mute);text-align:right}
.tot{font-size:13px}
.tot b{font-size:14px}
details summary{cursor:pointer;font-size:13px;margin:8px 0 4px}
.toast{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;z-index:60;max-width:calc(100vw - 24px)}
.toast.bad{background:var(--neg);color:#fff}
/* 인사이트 글 서식(post_format.css, 게시할 때 들어감) — 관리자 미리보기용 */
/* 인사이트 글 서식(post_format.js와 짝) — 공개 페이지와 관리자 미리보기 공용. publish_site.py가 두 템플릿의 PF_CSS 자리에 넣는다.
   색은 사이트 변수(--accent·--pos 상승 초록·--neg 하락 빨강 …)를 쓰고, 관리자 화면에 없는 변수는 뒤의 기본값으로. */
.prose > :first-child{margin-top:0}
.prose > :last-child{margin-bottom:0}
.prose h2{font-size:21px;line-height:1.4;margin:1.8em 0 .7em;letter-spacing:-.02em;font-weight:700}
.prose h3{font-size:18px;line-height:1.45;margin:1.6em 0 .6em;letter-spacing:-.02em}
.prose h4{font-size:16px;line-height:1.5;margin:1.4em 0 .5em;font-weight:700}
.prose h5{font-size:15px;line-height:1.5;margin:1.2em 0 .4em;font-weight:700;color:var(--text-2,var(--mute))}
.prose h2,.prose h3,.prose h4,.prose h5{scroll-margin-top:84px;word-break:keep-all;overflow-wrap:break-word}
.prose ol{margin:0 0 1.1em;padding-left:1.5em}
.prose ul{margin:0 0 1.1em;padding-left:1.2em}
.prose li > ul,.prose li > ol{margin:.3em 0 .2em}
.prose ol > li::marker{color:var(--mute);font-variant-numeric:tabular-nums}
.prose li.pf-ti{list-style:none;position:relative;padding-left:1.65em;margin-left:-1.2em}
.prose ol li.pf-ti{margin-left:-1.5em}
.pf-cb{position:absolute;left:0;top:.42em;width:1.02em;height:1.02em;border:1.5px solid var(--line-2,var(--mute));border-radius:4px;box-sizing:border-box}
.pf-cb.on{background:var(--accent);border-color:var(--accent)}
.pf-cb.on::after{content:"";position:absolute;left:.3em;top:.08em;width:.26em;height:.52em;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.prose li.pf-ti.done{color:var(--text-2,var(--mute))}
.prose strong{font-weight:700}
.prose mark{background:rgba(250,204,21,.42);color:inherit;padding:0 .12em;border-radius:3px}
.prose u{text-decoration-thickness:1px;text-underline-offset:3px}
.prose del{color:var(--mute)}
.prose sup{font-size:.72em;line-height:0}
.prose hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.prose code{font:500 .88em/1.5 var(--mono,ui-monospace,Consolas,monospace);background:var(--surface-2,rgba(127,127,127,.12));border:1px solid var(--line);border-radius:5px;padding:.06em .35em;overflow-wrap:anywhere}
.pf-code{margin:0 0 1.2em;padding:14px 16px;background:var(--surface-2,rgba(127,127,127,.1));border:1px solid var(--line);border-radius:10px;overflow:auto;font:500 13px/1.6 var(--mono,ui-monospace,Consolas,monospace);white-space:pre;overflow-wrap:normal}
.pf-code code{background:none;border:0;padding:0;font:inherit}
.prose blockquote{margin:0 0 1.1em;padding:.15em 0 .15em 1em;border-left:3px solid var(--line-2,var(--line));color:var(--text-2,var(--mute))}
.prose blockquote > :last-child{margin-bottom:0}
.prose blockquote.pf-quote{border-left-color:var(--accent);color:var(--text);font-size:1.06em;font-weight:500}
.pf-quote footer{margin-top:.4em;font-size:13.5px;font-weight:400;color:var(--mute)}
/* 박스: 핵심·참고·팁·주의·위험·확인·질문 */
.pf-box{--c:var(--accent);margin:0 0 1.2em;padding:13px 16px 14px;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;background:var(--surface-2,var(--surface))}
@supports (background:color-mix(in srgb,red 10%,transparent)){.pf-box{background:color-mix(in srgb,var(--c) 7%,var(--surface,transparent));border-color:color-mix(in srgb,var(--c) 26%,var(--line))}}
.pf-box.pf-note{--c:#3b6fd8}.pf-box.pf-tip{--c:#12915c}.pf-box.pf-key{--c:var(--accent)}.pf-box.pf-warn{--c:#c27c0e}
.pf-box.pf-risk{--c:#d0433f}.pf-box.pf-ok{--c:#12915c}.pf-box.pf-q{--c:#7c5cd6}
.pf-box.pf-disc{--c:var(--mute);font-size:14px}.pf-box.pf-disc .pf-bb{font-size:14px;color:var(--text-2,var(--mute))}
.pf-bt{font-weight:700;font-size:14.5px;line-height:1.4;color:var(--c);margin:0 0 6px;word-break:keep-all}
.pf-bb{font-size:15.5px}
.pf-bb > :last-child{margin-bottom:0}
/* 접기 */
.pf-det{margin:0 0 1.1em;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.pf-det > summary{cursor:pointer;padding:11px 16px;font-weight:600;list-style:none;display:flex;gap:8px;align-items:baseline}
.pf-det > summary::-webkit-details-marker{display:none}
.pf-det > summary::before{content:"▸";color:var(--mute);display:inline-block;transition:transform .15s}
.pf-det[open] > summary::before{transform:rotate(90deg)}
.pf-db{padding:0 16px 2px}
.pf-db > :last-child{margin-bottom:12px}
.pf-center{text-align:center}
.pf-right{text-align:right}
/* 2단·3단(휴대폰은 위아래) */
.pf-cols{display:grid;gap:14px 22px;margin:0 0 1.1em}
.pf-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pf-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.pf-cols > div > :last-child{margin-bottom:0}
@media(max-width:640px){.pf-cols-2,.pf-cols-3{grid-template-columns:1fr}}
/* 핵심 숫자 */
.pf-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px;margin:0 0 1.2em}
.pf-st{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.pf-st .l{font-size:12.5px;color:var(--mute);line-height:1.4}
.pf-st .v{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.3;font-variant-numeric:tabular-nums}
.pf-st .d{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
/* 표 */
.pf-tbl{margin:0 0 1.2em;overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
.pf-tbl table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.5;overflow-wrap:normal;word-break:keep-all}
.pf-tbl th,.pf-tbl td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:normal;font-family:inherit;letter-spacing:0;text-transform:none}
.pf-tbl thead th{position:static;cursor:default;line-height:1.5;user-select:text;border-bottom:1px solid var(--line)}
.pf-tbl th{background:var(--surface-2,rgba(127,127,127,.08));font-weight:600;font-size:13.5px;color:var(--text-2,var(--text))}
.pf-tbl tbody tr:last-child td{border-bottom:0}
.pf-tbl .pf-ar{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pf-tbl .pf-ac{text-align:center}
.pf-sched td{border-bottom:1px solid var(--line)}
.pf-sched .pf-sd{white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums;width:1%}
.prose .pf-up{color:var(--pos)}
.prose .pf-dn{color:var(--neg)}
/* 그림 */
.pf-fig{margin:0 0 1.2em}
.pf-fig img{display:block;max-width:100%;height:auto;margin:0 auto;border-radius:10px;border:1px solid var(--line)}
.pf-fig.pf-sz-s img{max-width:min(100%,280px)}
.pf-fig.pf-sz-m img{max-width:min(100%,480px)}
.pf-fig.pf-sz-l img,.pf-fig.pf-sz-f img{width:100%}
.pf-fig figcaption{margin-top:6px;text-align:center;color:var(--mute);font-size:13px;line-height:1.5}
.pf-gal{display:grid;gap:8px;margin:0 0 1.2em}
.pf-gal-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pf-gal-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.pf-gal-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:640px){.pf-gal-3,.pf-gal-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pf-gal .pf-fig{margin:0}
.pf-gal .pf-fig img{width:100%}
.pf-iimg img{display:inline-block;max-height:1.6em;width:auto;vertical-align:-.35em;border-radius:3px}
.pf-miss{color:var(--neg);font-size:13px}
.pf-yt{position:relative;aspect-ratio:16/9;margin:0 0 1.2em;border-radius:12px;overflow:hidden;background:#000}

  }

  function blocks(L, C){

  var FNDEF = /^\s{0,3}\[\^([^\]\s]{1,24})\]:\s*(.*)$/;

    if (amt > C) err = '배분할 비중이 현금(' + pct(C) + '%)보다 큽니다';
    else if (amt < n) err = '배분할 비중이 너무 작습니다';

  } else if (MS.mode === 'prop') {

function w1Proposal(){
  var c0 = comp(), I = sumC(c0), C = 10000 - I, idx = -1, nc = c0.map(clone), err = null;
  c0.forEach(function(r, i){ if (kOf(r) === MS.key) idx = i; });
  var w0 = idx >= 0 ? cents(c0[idx].weight) : 0, v = String(MS.val).trim(), tc = cents(v), d = tc - w0;
  if (v === '' || !isFinite(Number(v))) err = '변경 비중을 숫자로 적으세요';
  else if (!(tc > 0)) err = '0% 이하로 빼려면 편출을 쓰세요';
  else if (Math.abs(Number(v) * 100 - tc) > 1e-6) err = '비중은 소수 둘째 자리까지';
  else if (MS.mode === 'cash' && d > C) err = '현금(' + pct(C) + '%)이 부족합니다 — ' + (holdOn(S) ? '현금 안에서만 살 수 있습니다(먼저 다른 종목을 파세요)' : '"다른 종목 비례 조정"을 고르세요');
  if (!err && idx >= 0) {
    nc[idx].weight = tc / 100;
    if (MS.mode === 'prop') {
      var others = c0.filter(function(r, i){ return i !== idx; }), OI = I - w0;
      if (OI - d <= 0) err = '다른 종목 비중이 모자랍니다';
      else { var a = alloc(OI - d, others.map(function(r){ return cents(r.weight); })), j = 0; nc.forEach(function(r, i){ if (i !== idx) r.weight = a[j++] / 100; }); }
    }
  }
  return {c0: c0, nc: nc, w0: w0, C: C, err: err || compErr(nc), idx: idx};
}

// 새 상태 계산(저장 안 함) — 기존 제안 함수를 그대로 부른다. 전역 S·MS를 잠깐 바꿨다가 반드시 되돌린다.

  if (go) { e.preventDefault(); var el = document.getElementById(go.getAttribute('data-pf-go'));
    if (el) { for (var dt = el.parentElement; dt; dt = dt.parentElement) if (dt.tagName === 'DETAILS') dt.open = true; el.scrollIntoView({behavior: 'smooth', block: 'start'}); } return; }
  var b = e.target.closest('[data-pfa],[data-edv],[data-pki]'); if (!b) return;
  var ed = b.closest('[data-ed]'), k = ed && ed.dataset.ed; if (!k) return;
  if (b.dataset.edv) { ED.view = b.dataset.edv; edKeep(); render(); return; }
  if (b.dataset.pki) { var fp = b.dataset.pki, f = (FILES || []).filter(function(x){ return x.path === fp; })[0], sz = (ed.querySelector('[data-pks]') || {}).value || '';
    ED.pick = null; var ta0 = edTa(k), sel = ta0 ? [ta0.selectionStart, ta0.selectionEnd] : null;
    if (k === 'post.p.body' && SD.post && f && !SD.post.p.files.some(function(x){ return x.path === fp; })) SD.post.p.files = SD.post.p.files.concat([f]);
    render(); var ta1 = edTa(k); if (ta1 && sel) { ta1.focus(); ta1.setSelectionRange(sel[0], sel[1]); }
    if (ta1) edImgIns(ta1, fp, '', sz); return; }
  var a = b.dataset.pfa;
  if (a === 'help') { ED.help = ED.help === k ? null : k; var h = ed.querySelector('.pfh-slot'); if (h) { h.innerHTML = ED.help === k ? edHelp() : ''; if (ED.help === k) h.scrollIntoView({behavior: 'smooth', block: 'nearest'}); } return; }
  if (a === 'full') { ED.full = !ED.full; edKeep(); render(); return; }
  if (a === 'img') { ED.pick = ED.pick === k ? null : k; edKeep(); render(); if (FILES === null) loadFiles().then(function(){ edKeep(); render(); }); return; }
  if (a === 'imgx') { ED.pick = null; edKeep(); render(); return; }
  if (a === 'imgurl') { var u = (ed.querySelector('[data-pku]') || {}).value || '', cap = (ed.querySelector('[data-pkc]') || {}).value || '', sz2 = (ed.querySelector('[data-pks]') || {}).value || '';
    u = u.trim(); if (!/^https:\/\/\S+$/i.test(u)) return toast('그림 주소는 https:// 로 시작해야 합니다(보안 연결만).', true);
    ED.pick = null; render(); var ta2 = edTa(k); if (ta2) { ta2.focus(); ta2.setSelectionRange(ta2.value.length, ta2.value.length); edImgIns(ta2, u, cap, sz2); } return; }
  edAct(k, a);
});

function start(){
  $('#root').innerHTML = '<div class="card">불러오는 중…</div>';
  Promise.all([loadDoc(), canWrite(), loadIndex(), loadCalc()]).then(function(a){
    var d = a[0];
    if (!a[1]) {
      $('#root').innerHTML = '<div class="card"><b class="err">이 계정(' + esc((SES && SES.email) || '') + ')은 관리자가 아닙니다.</b>'
        + '<p class="help">보기만 할 수 있고 저장은 막혀 있습니다(Firestore 보안 규칙). 관리자 계정으로 다시 로그인하세요.</p><button type="button" id="out2">로그아웃</button></div>';
      $('#out2').onclick = logout;
      return;
    }
    UT = d.ut; S = norm(d.state);
    render();
    loadPriv().then(function(){ render(); nlInit(); });   // 관리자 전용 문서(손절가·지정가·명령 기록) → 명령 입력칸
    loadSite().then(function(){ if (VIEW === 'site' || VIEW === 'post') render(); });   // 사이트 탭(D-18) 설정
    Promise.all([loadPosts(), loadFiles()]).then(function(){ if (VIEW === 'site' || VIEW === 'post') render(); });   // 글 문서·첨부 목록(D-23)
  }).catch(function(x){ $('#root').innerHTML = '<div class="card err">' + esc(x.message) + '</div>'; });
}
var rt = lsGet('rs_admin_rt');
if (rt) refresh(rt).then(start, function(x){ lsSet('rs_admin_rt', null); showLogin(x.message); }); else showLogin();
})();
</script>
</body>
